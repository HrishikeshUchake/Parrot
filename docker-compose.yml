services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parrot_backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      # Allow connection to Ollama if it is running on the host machine
      - OLLAMA_BASE_URL=http://host.docker.internal:11434 
    depends_on:
      - neo4j
    volumes:
      # Mount the Backend directory for live-reloading during development
      - ./Backend:/app/Backend
    extra_hosts:
      # This allows the container to talk to localhost on the host machine (e.g. for Ollama)
      - "host.docker.internal:host-gateway"

  neo4j:
    image: neo4j:5
    container_name: parrot_neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # Bolt driver
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
